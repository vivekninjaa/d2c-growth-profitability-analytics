<title>D2C Growth & Profitability Analytics</title>
<style>
:root{
  --navy:#0d1b2a; --navy2:#14283f; --blue:#2f67ad; --blue2:#214d86;

  --green:#2e8b57; --red:#d9534f; --orange:#e8a317; --purple:#7653a6;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}
.sidebar{width:185px;background:linear-gradient(180deg,var(--navy),#091522);color:#fff;position:fixed;top:0;bottom:0;left:0;padding:16px 9px;border-right:1px solid #20354b}
.brand{font-size:15px;font-weight:800;padding:5px 8px 18px;display:flex;align-items:center;gap:9px}
.brand .cart{font-size:22px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{border:0;background:transparent;color:#e6edf5;text-align:left;padding:11px 10px;border-radius:4px;font-size:11px;font-weight:650;cursor:pointer}
.nav button:hover,.nav button.active{background:linear-gradient(90deg,#153b6d,#2b64ad)}
.side-foot{position:absolute;bottom:15px;left:17px;right:12px;font-size:9px;color:#a9b6c5;line-height:1.6}
.main{margin-left:185px;width:calc(100% - 185px);padding:14px 18px 20px}
.page{display:none}.page.active{display:block}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.title-wrap{display:flex;align-items:center;gap:10px}
.num{background:#244b7d;color:#fff;font-size:22px;font-weight:800;width:34px;height:34px;border-radius:5px;display:grid;place-items:center;box-shadow:0 2px 5px #b5c0ce}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.2px}
.filter-box{display:flex;flex-direction:column;font-size:9px;font-weight:700;gap:2px}
select{min-width:150px;border:1px solid var(--line);background:#fff;border-radius:4px;padding:6px 9px;font-size:11px;color:#334155}
.grid{display:grid;gap:9px}
.kpis{grid-template-columns:repeat(7,minmax(110px,1fr));margin-bottom:9px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;box-shadow:0 1px 3px rgba(15,23,42,.06);min-height:74px}
.kpi .label{font-size:9px;font-weight:700;color:#475569}.kpi .value{font-size:17px;font-weight:800;margin-top:8px}.kpi .sub{font-size:9px;margin-top:4px;color:var(--muted)}
.good{color:var(--green)!important}.bad{color:var(--red)!important}.warn{color:var(--orange)!important}
.row3{grid-template-columns:1.08fr 1.15fr .95fr}.row2{grid-template-columns:1.15fr .85fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 10px;box-shadow:0 1px 3px rgba(15,23,42,.06);min-width:0}
.card h3{font-size:11px;margin:0 0 7px;font-weight:800}.chart{height:188px}.chart.small{height:175px}
.table-card{margin-top:9px}.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:10px}th{background:#f3f6f9;color:#334155;text-align:left;padding:6px;border-bottom:1px solid var(--line);font-weight:800;white-space:nowrap}td{padding:6px;border-bottom:1px solid #edf1f5;white-space:nowrap}tr:hover td{background:#f8fafc}
.insights{margin-top:9px;background:linear-gradient(90deg,#f8fafc,#edf4fa);border:1px solid #d6e2ef;border-radius:6px;padding:8px 12px;display:grid;grid-template-columns:repeat(2,1fr);gap:7px;font-size:10px}
.insights b{font-size:10px}.insights ul{margin:2px 0 0 14px;padding:0}.insights li{margin:3px 0}
.badge{display:inline-block;padding:3px 8px;border-radius:3px;font-weight:800;font-size:9px;color:#fff}.badge.high{background:#c9372c}.badge.medium{background:#e3a008;color:#111827}.badge.low{background:#2e8b57}
.action-table td{white-space:normal}.action-table th{font-size:9px}.action-table td{font-size:9px}
.legend{font-size:9px;color:var(--muted);margin-top:3px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}.row3{grid-template-columns:1fr}.sidebar{width:160px}.main{margin-left:160px;width:calc(100% - 160px)}}
@media(max-width:760px){.sidebar{position:static;width:100%;min-height:auto}.app{display:block}.main{margin-left:0;width:100%}.nav{flex-direction:row;overflow:auto}.side-foot{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.header{align-items:flex-start}.row2{grid-template-columns:1fr}}
</style>
</head>

function barChart(id, items, labelKey, valueKey, opts={}){
  const el=document.getElementById(id); if(!el)return;
  const W=el.clientWidth||400,H=el.clientHeight||180,pL=opts.pL||72,pR=18,pT=10,pB=24;

    svg+=`<text x="${pL-6}" y="${y+barH/2+3}" text-anchor="end" font-size="9" fill="#334155">${esc(String(d[labelKey]).length>16?String(d[labelKey]).slice(0,16)+"…":d[labelKey])}</text>`;

  const el=document.getElementById(id);if(!el)return; const W=el.clientWidth||320,H=el.clientHeight||180,cx=W*.5,cy=H*.52,r=54,sw=28;
  const total=sum(items,valueKey)||1; const colors=["#1f77b4","#2e8b57","#f0a202","#8b5fbf","#d9534f","#4f6d7a"];let start=-Math.PI/2,paths="";
  items.forEach((d,i)=>{const a=(+d[valueKey]/total)*Math.PI*2,end=start+a, x1=cx+r*Math.cos(start),y1=cy+r*Math.sin(start),x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end),large=a>Math.PI?1:0;
    paths+=`<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="${sw}" stroke-linecap="butt"/>`; start=end;
  });
  let legend=items.map((d,i)=>`<div style="display:flex;gap:5px;align-items:center;font-size:9px;margin:3px 0"><span style="width:8px;height:8px;background:${colors[i%colors.length]};display:inline-block"></span>${esc(d[labelKey])}: <b>${(+d[valueKey]).toFixed(1)}%</b></div>`).join("");
  el.innerHTML=`<div style="display:flex;height:100%;align-items:center;justify-content:center;gap:18px"><svg viewBox="0 0 ${W} ${H}" width="58%" height="100%">${paths}<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="10" fill="#64748b">Portfolio</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="18" font-weight="800">100%</text></svg><div>${legend}</div></div>`;
}
function table(id, cols, arr, limit){
  const el=document.getElementById(id);if(!el)return;let rowsData=limit?arr.slice(0,limit):arr;
  el.innerHTML=`<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${rowsData.map(r=>`<tr>${cols.map(c=>`<td>${typeof c[1]==="function"?c[1](r):esc(r[c[1]])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function renderActions(){
 const p=rows(DATA.priority), m=rows(DATA.master), pay=rows(DATA.payment_penalty);
 const getM=n=>m.find(x=>x.seller_name===n)||{}, getP=n=>pay.find(x=>x.seller_name===n)||{};
 let actions=[];
 p.forEach(x=>{
  const mm=getM(x.seller_name), pp=getP(x.seller_name);
  if((mm.rto_pct_weighted||0)>30)actions.push(["RTO Reduction",x.seller_name,"High RTO",`RTO: ${pct(mm.rto_pct_weighted)}`,"Review product quality, state-level leakage, packaging and delivery experience","High","Operations"]);
  if((mm.profit_margin_pct||0)<0)actions.push(["Unit Economics",x.seller_name,"Negative margin",`Margin: ${pct(mm.profit_margin_pct)}`,"Review pricing, discounts, shipping cost and contribution economics","High","Growth / Finance"]);
  if((pp.cod_rto_penalty_pp||0)>30)actions.push(["Payment Mix",x.seller_name,"High COD penalty",`COD penalty: ${pp.cod_rto_penalty_pp.toFixed(1)} pp`,"Test prepaid incentives and selective COD restrictions","Medium","Growth"]);
 });
 if(!actions.length)actions=[["Portfolio","All Sellers","Portfolio prioritization","Use seller benchmark","Prioritize high-scale, healthy-margin sellers while fixing leakage before spending more","Medium","Leadership"]];
 document.getElementById("content-6").innerHTML=`<div class="card table-card"><h3>Management Action Matrix</h3><div id="action-table"></div></div>
 ${insight([["How to Use This Page",["Start with High-priority actions where scale and financial leakage overlap.","Assign a clear owner and track the supporting metric before/after intervention."]],["Portfolio Principle",["Profitable growth requires connecting marketing efficiency to downstream economics.","Scale weak economics only after the root cause is understood and addressed."]]])}`;
 document.getElementById("action-table").innerHTML=`<div class="table-wrap"><table class="action-table"><thead><tr><th>Area</th><th>Seller</th><th>Issue / Observation</th><th>Supporting Metric</th><th>Recommended Action</th><th>Priority</th><th>Owner</th></tr></thead><tbody>${actions.map(a=>`<tr><td>${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td>${a[3]}</td><td>${a[4]}</td><td><span class="badge ${a[5].toLowerCase()}">${a[5]}</span></td><td>${a[6]}</td></tr>`).join("")}</tbody></table></div>`;
}
